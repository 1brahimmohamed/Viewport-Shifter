name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Build release exe
        run: cargo build --release --locked

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "${{ steps.version.outputs.value }}"
          wix build wix/main.wxs -arch x64 `
            -d Version=$v `
            -d ExePath=target/release/viewport-shifter.exe `
            -d LicensePath=LICENSE `
            -o "dist/viewport-shifter-$v-x64.msi"
          Copy-Item target/release/viewport-shifter.exe "dist/viewport-shifter-$v-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: viewport-shifter-windows-x64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: viewport-shifter-windows-x64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
