[package]
name = "viewport-shifter"
version = "0.1.0"
edition = "2024"
description = "Move the center of a game off the bezel when playing across two monitors"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
